<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山河の饗宴 戦闘シミュレーター (ログ準拠版)</title>
<style>
  :root {
    --bg-color: #0f1218;
    --card-bg: #181c26;
    --card-sub-bg: #1f2533;
    --border-color: #2b3347;
    --accent-gold: #d4a359;
    --accent-gold-hover: #b8863b;
    --accent-blue: #4a9eff;
    --text-main: #e8ecf4;
    --text-muted: #8c96ac;
    --danger: #f05a5b;
    --success: #38c172;
    --warning: #f59f00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    padding: 16px;
    line-height: 1.5;
  }
  .container { max-width: 1280px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { color: var(--accent-gold); font-size: 1.8rem; letter-spacing: 1px; }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

  .players-compare-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 680px) {
    .players-compare-container { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-title { font-weight: 700; font-size: 1.05rem; }
  .title-gold { color: var(--accent-gold); }
  .title-blue { color: var(--accent-blue); }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 12px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group label {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 3px;
    font-weight: 500;
  }
  .form-group input, .form-group select, textarea {
    background: #11141c;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 0.9rem;
    width: 100%;
  }
  .form-group input:focus, .form-group select:focus, textarea:focus {
    border-color: var(--accent-gold);
    outline: none;
  }
  textarea { font-family: monospace; font-size: 0.78rem; min-height: 90px; resize: vertical; }

  .stage-select-box {
    background: var(--card-sub-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .box-title { font-size: 0.85rem; font-weight: bold; color: var(--accent-gold); margin-bottom: 8px; }
  .tip { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; }

  .enemy-block {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .enemy-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .enemy-header input { max-width: 180px; }

  .btn {
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
  .btn-secondary { background: #283042; color: var(--text-main); }
  .btn-secondary:hover { background: #36425a; }
  .btn-danger { background: var(--danger); color: #fff; }

  .controls-bar {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .calc-btn-container { flex: 1 1 220px; display: flex; gap: 8px; }
  .calc-btn {
    flex: 1;
    padding: 12px;
    font-size: 1.05rem;
    font-weight: bold;
    border-radius: 6px;
    background: linear-gradient(135deg, #d4a359, #b8863b);
    color: #111;
  }
  .calc-btn:hover { background: linear-gradient(135deg, #e6b366, #c99342); }

  .compare-result-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    margin-top: 14px;
  }
  @media (max-width: 768px) {
    .compare-grid { grid-template-columns: 1fr; }
    .vs-divider { display: none; }
  }
  .side-card {
    background: var(--card-sub-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }
  .side-card.winner {
    border-color: var(--accent-gold);
    box-shadow: 0 0 14px rgba(212, 163, 89, 0.3);
  }
  .vs-divider {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text-muted);
    display: flex;
    align-items: center;
  }
  .win-rate-title { font-size: 0.82rem; color: var(--text-muted); }
  .win-rate-num { font-size: 2.7rem; font-weight: 800; margin: 4px 0; }
  .diff-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .diff-plus { background: rgba(56, 193, 114, 0.2); color: var(--success); }
  .diff-minus { background: rgba(240, 90, 91, 0.2); color: var(--danger); }
  .diff-even { background: rgba(140, 150, 172, 0.2); color: var(--text-muted); }

  .stats-section-title {
    font-size: 0.78rem;
    font-weight: bold;
    color: var(--accent-gold);
    text-align: left;
    margin-top: 10px;
    padding-bottom: 4px;
    border-bottom: 1px dashed var(--border-color);
  }
  .stats-sub-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    text-align: left;
    margin-top: 8px;
  }
  .stats-sub-item { display: flex; flex-direction: column; }
  .stats-sub-label { font-size: 0.72rem; color: var(--text-muted); }
  .stats-sub-val { font-size: 0.95rem; font-weight: bold; }

  .trials-bench-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  .bench-item { background: rgba(0,0,0,0.25); border-radius: 4px; padding: 6px 2px; }
  .bench-label { font-size: 0.68rem; color: var(--text-muted); }
  .bench-val { font-size: 0.95rem; font-weight: bold; margin-top: 2px; }

  .verdict-box {
    text-align: center;
    margin-top: 16px;
    padding: 14px;
    border-radius: 6px;
    background: rgba(0,0,0,0.3);
    font-weight: 600;
  }
  #traceOutput {
    background: #0b0e14;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px;
    font-family: monospace;
    font-size: 0.78rem;
    white-space: pre;
    overflow-x: auto;
    max-height: 480px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>山河の饗宴 戦闘シミュレーター</h1>
    <div class="subtitle">戦闘ログ準拠ルール ／ A・B構成比較 ／ ログJSON読み込み対応</div>
  </header>

  <!-- 敵陣営設定 -->
  <div class="card" style="margin-bottom: 16px;">
    <div class="card-header">
      <span class="card-title title-gold">敵陣営設定</span>
      <button class="btn btn-sm btn-secondary" onclick="addEnemy()">+ 敵追加</button>
    </div>

    <div class="stage-select-box">
      <div class="box-title">ログ由来プリセット（選択すると敵情報が自動更新されます）</div>
      <div class="form-group">
        <label>戦闘 (eventId)</label>
        <select id="presetSelect" onchange="onPresetChange()"></select>
      </div>
      <div id="presetTip" class="tip"></div>
    </div>

    <div class="stage-select-box">
      <div class="box-title">ログJSONから読み込み</div>
      <textarea id="logInput" placeholder="キャプチャしたJSON（初回のみ／初回＋介入のどちらの形式でも可）を貼り付け"></textarea>
      <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
        <button class="btn btn-sm btn-secondary" onclick="importLog('A')">敵＋自キャラを構成Aに反映</button>
        <button class="btn btn-sm btn-secondary" onclick="importLog('B')">敵＋自キャラを構成Bに反映</button>
        <button class="btn btn-sm btn-secondary" onclick="importLog('')">敵のみ反映</button>
      </div>
      <div id="importTip" class="tip">読み取れるのはHP・ダメージ・吸血率・攻撃速度です。会心・強靭・回避・命中はログから求められないため、入力値をそのまま使います。</div>
    </div>

    <div id="enemyList"></div>
  </div>

  <!-- プレイヤー構成 -->
  <div class="card" style="margin-bottom: 16px;">
    <div class="card-header">
      <span class="card-title title-gold">プレイヤー ステータス比較設定</span>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-sm btn-secondary" onclick="copyConfig('pA', 'pB')">AをBにコピー</button>
        <button class="btn btn-sm btn-secondary" onclick="copyConfig('pB', 'pA')">BをAにコピー</button>
      </div>
    </div>

    <div class="players-compare-container">
      <div class="card" style="border-color: #59441f;">
        <div class="card-header">
          <span class="card-title title-gold">構成 A</span>
          <span id="pA_intervalTip" style="font-size: 0.75rem; color: var(--text-muted);"></span>
        </div>
        <div class="form-grid" id="pA_form"></div>
      </div>
      <div class="card" style="border-color: #21436e;">
        <div class="card-header">
          <span class="card-title title-blue">構成 B</span>
          <span id="pB_intervalTip" style="font-size: 0.75rem; color: var(--text-muted);"></span>
        </div>
        <div class="form-grid" id="pB_form"></div>
      </div>
    </div>
  </div>

  <!-- 制御バー -->
  <div class="controls-bar">
    <div class="form-group" style="min-width: 130px;">
      <label>試行回数 (各構成)</label>
      <select id="simTrials">
        <option value="1000">1,000回 (高速)</option>
        <option value="5000">5,000回</option>
        <option value="10000" selected>10,000回 (推奨)</option>
        <option value="30000">30,000回 (高精度)</option>
      </select>
    </div>
    <div class="form-group" style="min-width: 150px;">
      <label>絶技 (怒り1000で全体攻撃)</label>
      <select id="autoSkill">
        <option value="true" selected>発動する</option>
        <option value="false">温存 (通常攻撃のみ)</option>
      </select>
    </div>
    <div class="form-group" style="min-width: 190px;">
      <label>絶技の扱い</label>
      <select id="skillMode">
        <option value="extra" selected>通常攻撃の後に追加 (確認済み)</option>
        <option value="replace">通常攻撃を置き換え</option>
      </select>
    </div>
    <div class="form-group" style="min-width: 210px;">
      <label>手動ターゲット指定 (開幕の敵攻撃を省略)</label>
      <select id="manualFirst">
        <option value="false" selected>オフ (敵も0msから攻撃)</option>
        <option value="true">オン (敵は1×間隔から・確認済み)</option>
      </select>
    </div>
    <div class="form-group" style="min-width: 200px;">
      <label>通常攻撃ターゲット</label>
      <select id="targetPriority">
        <option value="boss" selected>ボス優先 (最大HP最大→id順・確認済み)</option>
        <option value="order">先頭から順番 (id順)</option>
        <option value="minMaxHp">雑魚優先 (最大HPが最小)</option>
        <option value="minCurHp">瀕死優先 (現在HPが最小)</option>
      </select>
    </div>
    <div class="form-group" style="min-width: 100px;">
      <label>会心倍率 (確認済み)</label>
      <input type="number" step="0.1" id="critMult" value="2.0">
    </div>
    <div class="form-group" style="min-width: 100px;">
      <label>絶技倍率 (確認済み)</label>
      <input type="number" step="0.1" id="skillMult" value="1.0">
    </div>
    <div class="calc-btn-container">
      <button class="btn calc-btn" onclick="runCompareSimulation()">A / B 比較実行</button>
      <button class="btn btn-secondary" onclick="runTrace()">1戦トレース (A)</button>
    </div>
  </div>

  <!-- 比較結果 -->
  <div class="compare-result-card" id="compareResultCard" style="display: none;">
    <div style="text-align: center; font-size: 1.15rem; font-weight: bold; color: var(--accent-gold);">
      シミュレーション比較結果
    </div>
    <div class="compare-grid">
      <div class="side-card" id="cardA"></div>
      <div class="vs-divider">VS</div>
      <div class="side-card" id="cardB"></div>
    </div>
    <div class="verdict-box" id="verdictText"></div>
  </div>

  <!-- トレース -->
  <div class="compare-result-card" id="traceCard" style="display: none;">
    <div style="font-size: 1.05rem; font-weight: bold; color: var(--accent-gold); margin-bottom: 10px;">
      1戦トレース（構成A・乱数1回分）
    </div>
    <div id="traceOutput"></div>
  </div>
</div>

<script>
// =====================================================================
// 戦闘ルール定数（取得ログから確認した値）
// =====================================================================
const SIM_RULES = {
  ANGER_TICK_MS: 100,     // 100ms区切りごとに加算
  ANGER_PER_TICK: 20,     // +20
  ANGER_MAX: 1000,        // 1000で絶技
  DODGE_CAP: 0.80,        // 未確認（従来値）
  MAX_BATTLE_MS: 180000   // 無限ループ防止の安全上限（ゲーム仕様ではない）
};

const STAT_FIELDS = [
  { key: "atk", label: "攻撃 (1回のダメージ)", step: "1" },
  { key: "hp", label: "HP (体力)", step: "1" },
  { key: "vampire", label: "吸血 (%)", step: "0.1" },
  { key: "speed", label: "攻撃速度 (%)", step: "0.01" },
  { key: "crit", label: "会心 (%) ※式未確認", step: "0.1" },
  { key: "tenacity", label: "強靭 (%) ※式未確認", step: "0.1" },
  { key: "dodge", label: "回避 (%) ※式未確認", step: "0.1" },
  { key: "hit", label: "命中 (%) ※式未確認", step: "0.1" }
];

// 間隔(ms) ⇔ 攻撃速度(%)
function speedToInterval(speed) {
  const s = speed > 0 ? speed : 100;
  return Math.max(1, Math.round(1000 / (s / 100)));
}
function intervalToSpeed(ms) {
  return Math.round((100000 / ms) * 100) / 100;
}

// =====================================================================
// ログ由来プリセット（name, HP, ダメージ, 吸血%, 間隔ms）
// 吸血が「不明」の敵は 0 を入れています
// =====================================================================
function E(name, hp, atk, vampire, ms) {
  return {
    name: name, hp: hp, atk: atk, vampire: vampire, speed: intervalToSpeed(ms),
    crit: 0, tenacity: 0, dodge: 0, hit: 0
  };
}

const PRESETS = [
  { id: "310101", note: "", enemies: [E("敵2", 5295, 1200, 6.8, 750), E("敵3", 5295, 1200, 6.8, 750)] },
  { id: "310103", note: "雑魚の吸血は6.7〜6.9%の推定", enemies: [E("雑魚2", 1675, 330, 6.8, 750), E("ボス3", 7780, 1550, 7.1, 746), E("雑魚4", 1675, 330, 6.8, 750)] },
  { id: "310104", note: "", enemies: [E("敵2", 6050, 1350, 8.1, 735), E("敵3", 6050, 1350, 8.1, 735)] },
  { id: "310105", note: "雑魚の吸血は不明(0)", enemies: [E("雑魚2", 1835, 365, 0, 737), E("ボス3", 8610, 1700, 8.8, 728), E("雑魚4", 1835, 365, 0, 737)] },
  { id: "310106", note: "雑魚の吸血は不明(0)", enemies: [E("雑魚2", 1875, 375, 0, 730), E("ボス3", 8755, 1750, 9.0, 726), E("雑魚4", 1875, 375, 0, 730)] },
  { id: "310107", note: "", enemies: [E("敵2", 5580, 1200, 6.5, 752), E("敵3", 5580, 1200, 6.5, 752)] },
  { id: "310108", note: "", enemies: [E("敵2", 3790, 815, 7.3, 743), E("敵3", 3790, 815, 7.3, 743), E("敵4", 3790, 815, 7.3, 743)] },
  { id: "310109", note: "雑魚の吸血は不明(0)", enemies: [E("雑魚2", 1745, 350, 0, 746), E("ボス3", 8320, 1600, 7.9, 737), E("雑魚4", 1745, 350, 0, 746)] },
  { id: "310201", note: "", enemies: [E("ボス2", 13200, 2250, 9.9, 715)] },
  { id: "410102", note: "敵の会心あり（率は未確認）", enemies: [E("敵2", 5525, 760, 0, 920), E("敵3", 5525, 760, 0, 920), E("敵4", 5525, 760, 0, 920)] },
  { id: "410109", note: "敵の会心あり（率は未確認）", enemies: [E("敵2", 7840, 1100, 0, 926), E("敵3", 7840, 1100, 0, 926)] }
];

// 自キャラ初期値（直近ログ: HP13362 / ダメージ1438 / 吸血9.9% / 789ms）
const DEFAULT_PLAYER = { atk: 1438, hp: 13362, vampire: 9.9, speed: intervalToSpeed(789), crit: 0, tenacity: 0, dodge: 0, hit: 0 };

let enemiesData = [];

// =====================================================================
// UI構築
// =====================================================================
function buildPlayerForm(prefix) {
  const form = document.getElementById(`${prefix}_form`);
  form.innerHTML = STAT_FIELDS.map(f => `
    <div class="form-group">
      <label>${f.label}</label>
      <input type="number" step="${f.step}" id="${prefix}_${f.key}" value="${DEFAULT_PLAYER[f.key]}" oninput="updateIntervalTip('${prefix}')">
    </div>
  `).join("");
  updateIntervalTip(prefix);
}

function updateIntervalTip(prefix) {
  const speed = parseFloat(document.getElementById(`${prefix}_speed`).value) || 100;
  document.getElementById(`${prefix}_intervalTip`).textContent = `行動間隔 ${speedToInterval(speed)}ms`;
}

function setPlayerConfig(prefix, cfg) {
  STAT_FIELDS.forEach(f => {
    if (cfg[f.key] !== undefined) {
      document.getElementById(`${prefix}_${f.key}`).value = cfg[f.key];
    }
  });
  updateIntervalTip(prefix);
}

function getPlayerConfig(prefix) {
  const cfg = {};
  STAT_FIELDS.forEach(f => {
    cfg[f.key] = parseFloat(document.getElementById(`${prefix}_${f.key}`).value) || 0;
  });
  if (cfg.hp <= 0) cfg.hp = 1;
  if (cfg.speed <= 0) cfg.speed = 100;
  return cfg;
}

function copyConfig(from, to) {
  setPlayerConfig(to, getPlayerConfig(from));
}

function initPresets() {
  const sel = document.getElementById("presetSelect");
  sel.innerHTML = PRESETS.map((p, i) => {
    const names = p.enemies.map(e => `${e.name}(HP${e.hp})`).join(" + ");
    return `<option value="${i}">${p.id}：${names}</option>`;
  }).join("");
  onPresetChange();
}

function onPresetChange() {
  const p = PRESETS[parseInt(document.getElementById("presetSelect").value) || 0];
  if (!p) return;
  enemiesData = JSON.parse(JSON.stringify(p.enemies));
  document.getElementById("presetTip").textContent = p.note ? `補足: ${p.note}` : "";
  renderEnemies();
}

function renderEnemies() {
  const container = document.getElementById("enemyList");
  container.innerHTML = "";
  enemiesData.forEach((e, idx) => {
    const div = document.createElement("div");
    div.className = "enemy-block";
    const fields = STAT_FIELDS.map(f => `
      <div class="form-group">
        <label>${f.label}</label>
        <input type="number" step="${f.step}" value="${e[f.key]}" onchange="updateEnemy(${idx}, '${f.key}', this.value)">
      </div>
    `).join("");
    div.innerHTML = `
      <div class="enemy-header">
        <strong style="color: var(--accent-gold); font-size: 0.9rem;">敵 ${idx + 1}（id ${idx + 2}）</strong>
        <input type="text" value="${e.name}" onchange="enemiesData[${idx}].name = this.value" style="background:#11141c;border:1px solid var(--border-color);color:var(--text-main);padding:4px 8px;border-radius:4px;">
        <span style="font-size: 0.75rem; color: var(--text-muted);">間隔 ${speedToInterval(e.speed)}ms</span>
        ${enemiesData.length > 1 ? `<button class="btn btn-sm btn-danger" onclick="removeEnemy(${idx})">削除</button>` : ""}
      </div>
      <div class="form-grid">${fields}</div>
    `;
    container.appendChild(div);
  });
}

function updateEnemy(index, field, value) {
  enemiesData[index][field] = parseFloat(value) || 0;
  if (field === "speed") renderEnemies();
}

function addEnemy() {
  enemiesData.push(E(`敵${enemiesData.length + 2}`, 5000, 1000, 0, 750));
  renderEnemies();
}

function removeEnemy(index) {
  enemiesData.splice(index, 1);
  renderEnemies();
}

// =====================================================================
// ログJSON読み込み
// =====================================================================
function estimateVampire(samples) {
  // samples: [{dealt, heal}]  heal = ceil(dealt × v) から v の範囲を絞り込む
  let lo = 0, hi = Infinity;
  samples.forEach(s => {
    lo = Math.max(lo, (s.heal - 1) / s.dealt);
    hi = Math.min(hi, s.heal / s.dealt);
  });
  if (!samples.length || hi < lo) return null;
  // 0.1%刻みで範囲内に入る値を優先
  for (let v = Math.ceil(lo * 1000 + 1e-9); v <= Math.floor(hi * 1000 + 1e-9); v++) {
    return v / 10;
  }
  return Math.round(((lo + hi) / 2) * 1000) / 10;
}

function analyzeUnit(list, unitId, maxHp) {
  const acts = list.filter(r => r.attacker && r.attacker.id === unitId && r.skillId === 0);
  // 間隔：自分の行動時刻の差の最小値
  const times = [...new Set(acts.map(r => r.atkTime))].sort((a, b) => a - b);
  let interval = null;
  for (let i = 1; i < times.length; i++) {
    const d = times[i] - times[i - 1];
    if (d > 0 && (interval === null || d < interval)) interval = d;
  }
  // ダメージ：会心・回避なし、かつ相手が倒れていない（頭打ちでない）ヒットの最大値
  let atk = null;
  const vampSamples = [];
  acts.forEach(r => {
    const d = r.defenseList && r.defenseList[0];
    if (!d) return;
    if (!d.isDodge && !d.isCrit && d.harmValue > 0 && d.curHp > 0) {
      atk = Math.max(atk || 0, d.harmValue);
    }
    // 吸血：回復後が最大HP未満（頭打ちでない）ものだけを使う
    if (d.harmValue > 0 && r.attacker.suckHp > 0 && r.attacker.curHp < maxHp) {
      vampSamples.push({ dealt: d.harmValue, heal: r.attacker.suckHp });
    }
  });
  return { interval, atk, vampire: estimateVampire(vampSamples) };
}

function importLog(target) {
  const tip = document.getElementById("importTip");
  let data;
  try {
    data = JSON.parse(document.getElementById("logInput").value);
  } catch (e) {
    tip.textContent = "JSONとして読み込めませんでした。貼り付け内容を確認してください。";
    return;
  }
  if (data && data.初回) data = data.初回;

  const list = data.戦闘計算結果_battleResultList || data.battleResultList || [];
  const npcs = data.敵一覧_npcObjList || data.npcObjList || [];
  if (!list.length || !npcs.length) {
    tip.textContent = "戦闘結果または敵一覧が見つかりませんでした。";
    return;
  }

  const unknown = [];

  // 敵
  enemiesData = npcs.map(n => {
    const a = analyzeUnit(list, n.id, n.maxHp);
    if (a.atk === null) unknown.push(`id${n.id}のダメージ`);
    if (a.vampire === null) unknown.push(`id${n.id}の吸血`);
    if (a.interval === null) unknown.push(`id${n.id}の間隔`);
    return {
      name: `敵${n.id}(npc${n.npcId})`,
      hp: n.maxHp,
      atk: a.atk || 0,
      vampire: a.vampire || 0,
      speed: a.interval ? intervalToSpeed(a.interval) : 100,
      crit: 0, tenacity: 0, dodge: 0, hit: 0
    };
  });
  renderEnemies();

  // 自キャラ
  if (target) {
    const first = list.find(r => r.attackerType === 1 && r.attacker.id === 1);
    const pMaxHp = first ? first.attacker.curHp : null;
    if (pMaxHp) {
      const a = analyzeUnit(list, 1, pMaxHp);
      const cfg = { hp: pMaxHp };
      if (a.atk) cfg.atk = a.atk;
      if (a.vampire !== null) cfg.vampire = a.vampire;
      if (a.interval) cfg.speed = intervalToSpeed(a.interval);
      setPlayerConfig(`p${target}`, cfg);
    } else {
      unknown.push("自キャラのHP");
    }
  }

  const eventId = data.ステージ情報 ? data.ステージ情報.eventId : "不明";
  tip.textContent = `eventId ${eventId} を読み込みました。` +
    (unknown.length ? ` ログから求められなかった項目（0または初期値）: ${unknown.join("、")}` : "");
}

// =====================================================================
// シミュレーション本体
// =====================================================================
function readSimOptions() {
  return {
    autoSkill: document.getElementById("autoSkill").value === "true",
    skillMode: document.getElementById("skillMode").value,
    manualFirst: document.getElementById("manualFirst").value === "true",
    targetPriority: document.getElementById("targetPriority").value,
    critMult: parseFloat(document.getElementById("critMult").value) || 2.0,
    skillMult: parseFloat(document.getElementById("skillMult").value) || 1.0
  };
}

function makeUnit(def, id, offset) {
  const interval = speedToInterval(def.speed);
  return {
    id: id,
    name: def.name || (id === 1 ? "自分" : `敵${id}`),
    maxHp: def.hp,
    curHp: def.hp,
    atk: def.atk,
    vampire: def.vampire,
    crit: def.crit,
    tenacity: def.tenacity,
    dodge: def.dodge,
    hit: def.hit,
    interval: interval,
    offset: offset,
    nextTime: offset * interval,
    count: 0
  };
}

// 怒り = (今の100ms区切り − 絶技時点の100ms区切り) × 20
function getAnger(now, angerBase) {
  if (now < 0) return 0;
  const ticks = Math.floor(now / SIM_RULES.ANGER_TICK_MS) - Math.floor(angerBase / SIM_RULES.ANGER_TICK_MS);
  return Math.min(SIM_RULES.ANGER_MAX, Math.max(0, ticks * SIM_RULES.ANGER_PER_TICK));
}

function pickTarget(alive, priority) {
  if (priority === "minCurHp") return alive.reduce((a, b) => (b.curHp < a.curHp ? b : a));
  if (priority === "minMaxHp") return alive.reduce((a, b) => (b.maxHp < a.maxHp ? b : a));
  if (priority === "order") return alive[0];
  return alive.reduce((a, b) => (b.maxHp > a.maxHp ? b : a)); // boss
}

// 1回の攻撃判定。{ dealt, isCrit, isDodge } を返す
function rollAttack(att, def, critMult, dmgMult) {
  const dodgeP = Math.min(SIM_RULES.DODGE_CAP, Math.max(0, (def.dodge - att.hit) / 100));
  const critP = Math.min(1, Math.max(0, (att.crit - def.tenacity) / 100));
  const isCrit = Math.random() < critP;   // 回避時にも会心判定あり（ログ準拠）
  if (Math.random() < dodgeP) {
    return { dealt: 0, isCrit: isCrit, isDodge: true };
  }
  const dmg = Math.floor(att.atk * dmgMult * (isCrit ? critMult : 1));
  const dealt = Math.min(def.curHp, dmg);
  def.curHp -= dealt;
  return { dealt: dealt, isCrit: isCrit, isDodge: false };
}

// 吸血 = ceil(実ダメージ × 吸血率)、最大HPまで。実回復量を返す
function applyVampire(unit, dealt) {
  if (unit.vampire <= 0 || dealt <= 0) return 0;
  const heal = Math.ceil(dealt * unit.vampire / 100 - 1e-9);
  const before = unit.curHp;
  unit.curHp = Math.min(unit.maxHp, unit.curHp + heal);
  return unit.curHp - before;
}

function simulateSingle(p_def, e_defs, opt, trace) {
  const p = makeUnit(Object.assign({ name: "自分" }, p_def), 1, 0);
  const enemies = e_defs.map((e, i) => makeUnit(e, i + 2, opt.manualFirst ? 1 : 0));
  let angerBase = 0;
  let now = 0;

  const log = (text) => { if (trace) trace.push(text); };
  const flag = (r) => (r.isDodge ? " [回避]" : "") + (r.isCrit ? " [会心]" : "");

  function castSkill() {
    const parts = [];
    enemies.filter(e => e.curHp > 0).forEach(t => {
      const r = rollAttack(p, t, opt.critMult, opt.skillMult);
      parts.push(`${t.name} -${r.dealt}${flag(r)} (残${t.curHp})`);
    });
    log(`${String(now).padStart(6)}ms  自分 ★絶技  ${parts.join(" / ")}`);
    angerBase = now;
  }

  while (true) {
    const alive = enemies.filter(e => e.curHp > 0);
    if (alive.length === 0) {
      log(`--- 勝利 ${now}ms / 残りHP ${p.curHp} ---`);
      return { win: true, time: Math.max(0, now), hp: p.curHp };
    }
    if (p.curHp <= 0) {
      log(`--- 敗北 ${now}ms ---`);
      return { win: false, time: now, hp: 0 };
    }

    // 次の行動者（同時刻はプレイヤー → 敵id順）
    let actor = p;
    for (const e of alive) {
      if (e.nextTime < actor.nextTime) actor = e;
    }
    now = actor.nextTime;
    if (now > SIM_RULES.MAX_BATTLE_MS) {
      log(`--- 時間上限で打ち切り ---`);
      return { win: false, timeout: true, time: now, hp: p.curHp };
    }

    if (actor === p) {
      const anger = getAnger(now, angerBase);
      const skillReady = opt.autoSkill && anger >= SIM_RULES.ANGER_MAX;

      if (skillReady && opt.skillMode === "replace") {
        castSkill();
      } else {
        const target = pickTarget(alive, opt.targetPriority);
        const r = rollAttack(p, target, opt.critMult, 1);
        const heal = applyVampire(p, r.dealt);
        log(`${String(now).padStart(6)}ms  自分 → ${target.name} -${r.dealt}${flag(r)} (敵残${target.curHp}) 吸血+${heal} 自HP${p.curHp} 怒り${anger}`);
        if (skillReady && enemies.some(e => e.curHp > 0)) {
          castSkill();
        }
      }
    } else {
      const r = rollAttack(actor, p, opt.critMult, 1);
      const heal = applyVampire(actor, r.dealt);
      log(`${String(now).padStart(6)}ms  ${actor.name} → 自分 -${r.dealt}${flag(r)} 自HP${p.curHp} 敵吸血+${heal}(敵残${actor.curHp}) 怒り${getAnger(now, angerBase)}`);
    }

    actor.count++;
    actor.nextTime = (actor.offset + actor.count) * actor.interval;
  }
}

function runBatchSimulation(p_def, e_defs, trials, opt) {
  let winCount = 0, timeoutCount = 0, totalWinTime = 0, totalWinHp = 0;
  for (let i = 0; i < trials; i++) {
    const res = simulateSingle(p_def, e_defs, opt, null);
    if (res.win) {
      winCount++;
      totalWinTime += res.time;
      totalWinHp += res.hp;
    } else if (res.timeout) {
      timeoutCount++;
    }
  }
  const winRate = (winCount / trials) * 100.0;
  const avgTime = winCount > 0 ? (totalWinTime / winCount / 1000) : 0;
  const avgHp = winCount > 0 ? (totalWinHp / winCount) : 0;
  const avgHpRate = (avgHp / p_def.hp) * 100.0;
  return { winCount, timeoutCount, winRate, avgTime, avgHp, avgHpRate, probMetrics: calculateProbMetrics(winRate) };
}

function calculateProbMetrics(winRatePct) {
  const p = winRatePct / 100.0;
  if (p <= 0) return { p100: 0, n50: "∞", n80: "∞", n90: "∞", n99: "∞" };
  if (p >= 1) return { p100: 100, n50: "1回", n80: "1回", n90: "1回", n99: "1回" };
  const getN = (t) => Math.ceil(Math.log(1 - t) / Math.log(1 - p)).toLocaleString() + "回";
  return {
    p100: (1 - Math.pow(1 - p, 100)) * 100,
    n50: getN(0.50), n80: getN(0.80), n90: getN(0.90), n99: getN(0.99)
  };
}

// =====================================================================
// 実行・表示
// =====================================================================
function runCompareSimulation() {
  if (enemiesData.length === 0) {
    alert("敵が設定されていません。");
    return;
  }
  const pA = getPlayerConfig("pA");
  const pB = getPlayerConfig("pB");
  const trials = parseInt(document.getElementById("simTrials").value) || 10000;
  const opt = readSimOptions();

  const resA = runBatchSimulation(pA, enemiesData, trials, opt);
  const resB = runBatchSimulation(pB, enemiesData, trials, opt);
  displayComparisonResults(resA, resB, trials);
}

function runTrace() {
  if (enemiesData.length === 0) {
    alert("敵が設定されていません。");
    return;
  }
  const trace = [];
  simulateSingle(getPlayerConfig("pA"), enemiesData, readSimOptions(), trace);
  document.getElementById("traceCard").style.display = "block";
  document.getElementById("traceOutput").textContent = trace.join("\n");
}

function sideCardHtml(label, color, res, trials) {
  const m = res.probMetrics;
  return `
    <div style="font-weight: bold; color: ${color}; font-size: 1.1rem;">${label}</div>
    <div class="win-rate-title">突破率 (1回あたりの勝率)</div>
    <div class="win-rate-num" style="color: ${getWinRateColor(res.winRate)};">${res.winRate.toFixed(2)}%</div>
    <div class="diff-badge" data-role="diff">-</div>

    <div class="stats-section-title">突破確率・試行回数目安</div>
    <div class="stats-sub-grid">
      <div class="stats-sub-item"><span class="stats-sub-label">100回以内突破率</span><span class="stats-sub-val" style="color: ${color};">${m.p100.toFixed(2)}%</span></div>
      <div class="stats-sub-item"><span class="stats-sub-label">平均時間 (勝利時)</span><span class="stats-sub-val">${res.winCount > 0 ? res.avgTime.toFixed(2) + " 秒" : "-"}</span></div>
    </div>
    <div style="margin-top: 8px; text-align: left;">
      <span class="stats-sub-label">指定確率での必要試行回数目安:</span>
      <div class="trials-bench-grid">
        <div class="bench-item"><div class="bench-label">50%</div><div class="bench-val">${m.n50}</div></div>
        <div class="bench-item"><div class="bench-label">80%</div><div class="bench-val">${m.n80}</div></div>
        <div class="bench-item"><div class="bench-label">90%</div><div class="bench-val">${m.n90}</div></div>
        <div class="bench-item"><div class="bench-label">99%</div><div class="bench-val">${m.n99}</div></div>
      </div>
    </div>

    <div class="stats-section-title">戦闘統計</div>
    <div class="stats-sub-grid">
      <div class="stats-sub-item"><span class="stats-sub-label">勝利数 / 試行数</span><span class="stats-sub-val">${res.winCount.toLocaleString()} / ${trials.toLocaleString()}</span></div>
      <div class="stats-sub-item"><span class="stats-sub-label">平均残りHP (残率)</span><span class="stats-sub-val">${res.winCount > 0 ? Math.round(res.avgHp).toLocaleString() + " (" + res.avgHpRate.toFixed(1) + "%)" : "-"}</span></div>
      ${res.timeoutCount > 0 ? `<div class="stats-sub-item"><span class="stats-sub-label">時間上限で打ち切り</span><span class="stats-sub-val" style="color: var(--warning);">${res.timeoutCount.toLocaleString()}</span></div>` : ""}
    </div>
  `;
}

function displayComparisonResults(resA, resB, trials) {
  document.getElementById("compareResultCard").style.display = "block";
  const cardA = document.getElementById("cardA");
  const cardB = document.getElementById("cardB");
  cardA.innerHTML = sideCardHtml("構成 A", "var(--accent-gold)", resA, trials);
  cardB.innerHTML = sideCardHtml("構成 B", "var(--accent-blue)", resB, trials);

  const diffA = resA.winRate - resB.winRate;
  setDiffBadge(cardA.querySelector('[data-role="diff"]'), diffA);
  setDiffBadge(cardB.querySelector('[data-role="diff"]'), -diffA);

  cardA.classList.remove("winner");
  cardB.classList.remove("winner");
  const verdict = document.getElementById("verdictText");
  if (Math.abs(diffA) < 0.2) {
    verdict.innerHTML = `両構成の勝率はほぼ同等です（差: ${Math.abs(diffA).toFixed(2)}%）。100回以内突破率や残りHPも参考にしてください。`;
    verdict.style.color = "var(--text-main)";
  } else if (diffA > 0) {
    cardA.classList.add("winner");
    verdict.innerHTML = `【構成 A】が突破率で <span style="color: var(--success);">+${diffA.toFixed(2)}%</span> 優位です。`;
    verdict.style.color = "var(--accent-gold)";
  } else {
    cardB.classList.add("winner");
    verdict.innerHTML = `【構成 B】が突破率で <span style="color: var(--accent-blue);">+${(-diffA).toFixed(2)}%</span> 優位です。`;
    verdict.style.color = "var(--accent-blue)";
  }
}

function setDiffBadge(elem, diff) {
  if (Math.abs(diff) < 0.05) {
    elem.className = "diff-badge diff-even";
    elem.textContent = "±0.00%";
  } else if (diff > 0) {
    elem.className = "diff-badge diff-plus";
    elem.textContent = `+${diff.toFixed(2)}%`;
  } else {
    elem.className = "diff-badge diff-minus";
    elem.textContent = `${diff.toFixed(2)}%`;
  }
}

function getWinRateColor(rate) {
  return rate >= 70 ? "var(--success)" : (rate >= 30 ? "var(--warning)" : "var(--danger)");
}

window.addEventListener("DOMContentLoaded", () => {
  buildPlayerForm("pA");
  buildPlayerForm("pB");
  initPresets();
});
</script>
