                    calculate(ticket);
                }, delay);
            }

            async function calculate(ticket) {
                if (ticket !== revision) {
                    return;
                }

                timer = null;
                $("status").textContent = "計算中…";

                try {
                    const validation = validateConfig(config);

                    if (!validation.input) {
                        showErrors(validation.errors);
                        $("status").textContent = "入力エラーがあります";
                        return;
                    }

                    await yieldToBrowser();

                    if (ticket !== revision) {
                        return;
                    }

                    const input = validation.input;
                    let calculated;
                    let reversed = null;

                    if (input.mode === "reverse") {
                        const solved = await solveRequiredItems(input, ticket);
                        calculated = solved.result;
                        reversed = solved.reverse;
                    } else {
                        calculated = simulate(input);
                    }

                    if (ticket !== revision) {
                        return;
                    }

                    result = calculated;
                    reverseResult = reversed;

                    renderResults();

                    $("status").textContent = (
                        reverseResult && !reverseResult.possible
                    )
                        ? "必要個数は算出できません。参考計算を表示しています。"
                        : "計算完了";
                } catch (error) {
                    if (error === CANCELLED || ticket !== revision) {
                        return;
                    }

                    console.error(error);

                    result = null;
                    reverseResult = null;

                    renderResults();
                    showErrors([
                        "計算の安全チェックに失敗しました。" +
                        "入力を確認するか、設定を初期化してください。"
                    ]);

                    $("status").textContent = "計算を中止しました";
                } finally {
                    if (ticket === revision) {
                        $("results").setAttribute("aria-busy", "false");
                    }
                }
            }

            function setSettingsOpen(open, scroll = false) {
                $("settings-panel").classList.toggle("is-open", open);
                $("settings-toggle").setAttribute(
                    "aria-expanded",
                    String(open)
                );
                $("settings-toggle").textContent = open
                    ? "設定を閉じる"
                    : "設定を開く";

                if (scroll) {
                    $("results").scrollIntoView({
                        block: "start",
                        behavior: "auto"
                    });
                }
            }

            function handleInput(event) {
                const binding = bindings.get(event.target);

                if (!binding) {
                    return;
                }

                const value = event.target.value;

                if (binding.object[binding.key] === value) {
                    return;
                }

                binding.object[binding.key] = value;
                invalidate();
            }

            $("app").addEventListener("input", handleInput);
            $("app").addEventListener("change", handleInput);

            $("app").addEventListener("click", (event) => {
                if (!(event.target instanceof Element)) {
                    return;
                }

                const button = event.target.closest("button[data-action]");

                if (!button || button.disabled) {
                    return;
                }

                switch (button.dataset.action) {
                    case "recalculate":
                        invalidate(0);
                        break;

                    case "toggle-settings":
                        setSettingsOpen(
                            !$("settings-panel").classList.contains("is-open")
                        );
                        break;

                    case "close-settings":
                        setSettingsOpen(false, true);
                        break;

                    case "more-logs":
                        appendLogs();
                        break;

                    case "preset": {
                        const value = Number(button.dataset.value);

                        if (!BUFF_OPTIONS.includes(value)) {
                            return;
                        }

                        for (let index = 1; index < 60; index += 1) {
                            config.buffs[index] = value;
                            ui.buffControls[index].value = String(value);
                        }

                        config.buffs[0] = 3;
                        ui.buffControls[0].value = "3";
                        invalidate();
                        break;
                    }

                    case "add-offline":
                        if (
                            config.offlinePeriods.length >= MAX_OFFLINE_PERIODS
                        ) {
                            return;
                        }

                        config.offlinePeriods.push({
                            id: nextOfflineId++,
                            startDay: 1,
                            startTime: "23:00:00",
                            endDay: 2,
                            endTime: "07:00:00"
                        });

                        renderOfflinePeriods();
                        invalidate();
                        break;

                    case "remove-offline": {
                        const id = Number(button.dataset.id);
                        const index = config.offlinePeriods.findIndex(
                            (period) => period.id === id
                        );

                        if (index !== -1) {
                            config.offlinePeriods.splice(index, 1);
                            renderOfflinePeriods();
                            invalidate();
                        }
                        break;
                    }

                    case "adjust-items": {
                        const index = Number(button.dataset.grade);
                        const delta = Number(button.dataset.delta);

                        if (
                            !Number.isInteger(index) ||
                            index < startingGrade() ||
                            index >= LAST_GRADE ||
                            ![-1, 1].includes(delta) ||
                            config.calculationMode !== "forward"
                        ) {
                            return;
                        }

                        const raw = Number(config.settings[index].itemCount);
                        const current = Number.isFinite(raw)
                            ? Math.trunc(raw)
                            : 0;

                        const count = Math.max(
                            0,
                            Math.min(MAX_ITEMS, current + delta)
                        );

                        config.settings[index].itemCount = count;
                        rowNodes[index].input.value = String(count);
                        invalidate();
                        break;
                    }

                    case "reset":
                        if (
                            !window.confirm(
                                "すべての設定を初期状態に戻しますか？"
                            )
                        ) {
                            return;
                        }

                        config = createDefaultConfig();
                        nextOfflineId = 1;

                        buildSettings();
                        buildRows();
                        invalidate(0);
                        break;
                }
            });

            $("log-details").addEventListener("toggle", () => {
                if ($("log-details").open && result && shownLogs === 0) {
                    appendLogs();
                }
            });

            try {
                buildSettings();
                buildRows();
                updateVisibility();

                $("app").hidden = false;
                $("boot-status").remove();

                invalidate(0);
            } catch (error) {
                console.error(error);

                const boot = $("boot-status");

                if (boot) {
                    boot.textContent = (
                        "アプリを起動できませんでした。" +
                        "対応するブラウザーで開き直してください。"
                    );
                }
            }
        })();
    </script>
</body>
</html>
